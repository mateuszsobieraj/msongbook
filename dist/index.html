<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSongbook</title>
    <link rel="icon" href="./assets/banjo.svg" type="image/svg+xml">
  <script type="module" crossorigin src="./assets/index-DKqhOsgg.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/chordsheet-Dtce1Nl_.js">
  <link rel="stylesheet" crossorigin href="./assets/index-BeJEMZlA.css">
</head>
<body>
    <div id="root">
        <div style="font-family: system-ui, sans-serif; padding: 24px; color: #222;">
            Loading MSongbook...
        </div>
    </div>
    <script>
        window.setTimeout(function () {
            var isPages = window.location.hostname.endsWith("github.io");
            var isFallbackRoot = !window.location.pathname.includes("/dist/");
            var root = document.getElementById("root");
            var stillLoading = root && root.textContent.includes("Loading MSongbook");

            if (isPages && isFallbackRoot && stillLoading) {
                window.location.replace("./dist/");
            }
        }, 4000);
    </script>
</body>
</html>
